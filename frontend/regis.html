<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html">UrbanPulse</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" title="Login required">Report Problem</a>
            <a href="Problems.html">Problems</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="registration-grid">

            <!-- User Registration -->
            <section class="auth-card">
                <h1>Register as User</h1>

                <form action="reportproblem.html">
                    <div class="form-group">
                        <label for="user-name">Full Name</label>
                        <input class="form-control" id="user-name" name="name"
                               type="text" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="user-email">Email</label>
                        <input class="form-control" id="user-email" name="email"
                               type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="user-mobile">Mobile Number</label>
                        <input class="form-control" id="user-mobile" name="mobile"
                               type="tel" placeholder="9457743456" required>
                    </div>

                    <div class="form-group">
                        <label for="user-password">Password</label>
                        <input class="form-control" id="user-password" name="password"
                               type="password" required>
                    </div>

                    <div class="form-group">
                        <label for="user-confirm-password">Confirm Password</label>
                        <input class="form-control" id="user-confirm-password"
                               name="confirm_password" type="password" required>
                    </div>

                    <button class="btn-primary" type="submit">Create User Account</button>
                </form>

                <p class="auth-links">
                    Already registered?
                    <a href="login.html">Login</a>
                </p>
            </section>

            <!-- Admin Registration -->
            <section class="auth-card">
                <h1>Register as Admin</h1>

                <form action="login1.html">
                    <div class="form-group">
                        <label for="admin-name">Full Name</label>
                        <input class="form-control" id="admin-name" name="name"
                               type="text" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="admin-email">Email</label>
                        <input class="form-control" id="admin-email" name="email"
                               type="email" placeholder="admin@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="admin-mobile">Mobile Number</label>
                        <input class="form-control" id="admin-mobile" name="mobile"
                               type="tel" placeholder="9457743456" required>
                    </div>

                    <div class="form-group">
                        <label for="admin-password">Password</label>
                        <input class="form-control" id="admin-password" name="password"
                               type="password" required>
                    </div>

                    <div class="form-group">
                        <label for="admin-confirm-password">Confirm Password</label>
                        <input class="form-control" id="admin-confirm-password"
                               name="confirm_password" type="password" required>
                    </div>

                    <button class="btn-primary" type="submit">Create Admin Account</button>
                </form>

                <p class="auth-links">
                    Already registered?
                    <a href="login1.html">Admin Login</a>
                </p>
            </section>

        </div>
    </main>
</body>
</html>
