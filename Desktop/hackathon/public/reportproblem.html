<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title> Report problem </title>
</head>
<body>
	<header class="navbar">
			<a href="index.html">UrbanPulse</a>
		<nav>	
			<a href="index.html">Home</a>
			<a href="reportproblem.html" title="Login required">Report Problem</a>
			<a href="problems.html">Problems</a>
			
		</nav>
	</header>
  <main class="upload-page">
     
  	<div class="upload-heading">
  		<h1>Report a Civic Issue</h1>
  	</div>
  	<div class="upload-layout">

  		<section class="upload-card">
  			<form action="http://localhost:5000/api/complaints" method="POST" enctype="multipart/form-data">
                <!-- Photo Upload -->
                <div class="form-group">

                    <label for="photo"> Photo of the problem </label>

                    <label class="upload-area" for="photo">

                        <strong>Upload a supporting photo</strong>
					<input id="photo" name="photo" type="file" accept="image/*">

                    </label>

                </div>

                <!-- Problem Type -->
                <div class="form-group">

                    <label for="problem-type">
                        Problem Type
                    </label>

                    <select id="problem-type" name="category" class="form-control" required>
                        id="problem-type"
                        class="form-control"
                        required>

                        <option value="">Select a category</option>
                        <option>Pothole</option>
                        <option>Garbage</option>
                        <option>Drainage</option>
                        <option>Broken Streetlight</option>
                        <option>Road Damage</option>
                        <option>Water Leakage</option>
                        <option>Other</option>

                    </select>
                    <div
                    id="other-type-wrap"
                    class="form-group"
                    hidden
                        >
                    <label for="other-type">Your problem type</label>

                    <input
                        class="form-control"
                        id="other-type"
                        name="otherType"
                        minlength="3"
                        placeholder="At least 3 characters">
                    </div>

                <!-- Priority -->
                <label>Priority</label>

                    <div class="radio-options">

                        <label>
                            <input
                                <input type="radio" name="priority" value="Low" checked>
                                name="priority"
                                checked>
                            Low
                        </label>

                        <label>
                            <input
                                <input type="radio" name="priority" value="Medium">
                                name="priority">
                            Medium
                        </label>

                        <label>
                            <input
                                <input type="radio" name="priority" value="High">
                                name="priority">
                            High
                        </label>

                    </div>

                

                <!-- Description -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea class="form-control" id="description" name="description"
                        class="form-control"
                        id="description"
                        placeholder="Describe what you observed and how it affects the area."
                        required>
                    </textarea>

                </div>

                <!-- Status -->
                <div class="form-group">

                    <label for="status">
                        Report Status
                    </label>

                    <input
                        class="form-control"
                        id="status"
                        value="Submitted"
                        readonly>

                </div>

                <!-- Buttons -->
                <div class="button-row">

                    <button
                        class="btn-primary"
                        type="submit">
                        Submit Report →
                    </button>

                    <a
                        class="btn-secondary"
                        href="index.html">
                        ← Back to Dashboard
                    </a>

                </div>

            </form>

		</section>
   		  	
	</div>
 </main>
<!-- <script src="auth.js"></script> -->
<!-- <script src="api.js"></script> -->
<!-- <script src="reportproblem.js"></script> -->
</body>
</html>
